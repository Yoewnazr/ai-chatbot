<script>
/* ============================================================
   STATE (dalam memori sahaja; pengekalan di IndexedDB)
============================================================ */
const state = {
  conversations: [],   // [{id, title, updatedAt}]
  currentId: null,     // id perbualan aktif (null = belum disimpan)
  messages: [],        // mesej aktif [{role, content}]
  streaming: false,
  controller: null,    // AbortController untuk berhenti
  attachedImages: [],  // [{dataUrl, name}]
  sidebarVisible: false,
  model: '',           // V2: id model aktif (diisi semasa init)
  persona: 'general',  // V2: id persona aktif
  listening: false,    // V2: status voice-to-text
  user: null,          // V3: profil pengguna Supabase (null = guest)
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const sendIcon = $('sendIcon');
const convListEl = $('convList');
const convTitleEl = $('convTitle');
const imagePreviewWrap = $('imagePreviewWrap');
const modelBadge = $('modelBadge');
const modelSelect = $('modelSelect');
const personaSelect = $('personaSelect');
const micBtn = $('micBtn');

// Marked config
marked.setOptions({ breaks: true, gfm: true });

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMarkdown(text) {
  return marked.parse(text || '');
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 192) + 'px';
}

function scrollToBottom(force) {
  if (force || !state.streaming) {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

/* Pastikan pengguna berada di bahagian bawah skrin (dalam toleransi kecil). */
function isNearBottom() {
  const gap = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
  return gap < 80;
}

/* Kemas kini mesej streaming dengan throttle: gunakan requestAnimationFrame
   supaya marked.parse + innerHTML TIDAK dijalankan pada setiap chunk,
   mengelakkan jank apabila teks semakin panjang. */
let streamRenderScheduled = false;
function scheduleStreamRender(assistantEl, getFull) {
  if (streamRenderScheduled) return;
  streamRenderScheduled = true;
  requestAnimationFrame(() => {
    streamRenderScheduled = false;
    const text = getFull();
    if (assistantEl) assistantEl.innerHTML = renderMarkdown(text);
    // Auto-scroll hanya jika pengguna berada di bawah (bukan smooth supaya tak bertindih)
    if (isNearBottom()) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  });
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}



/* ============================================================
   INDEXEDDB STORAGE (penyimpanan sebelah klien — untuk GUEST)
   Pengguna yang log masuk (V3) diselaraskan ke Supabase.
============================================================ */
const DB_NAME = 'ai-chat-db';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, value) {
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbGet(store, key) {
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  }));
}

function dbGetAll(store) {
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  }));
}

function dbDelete(store, key) {
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

/* Simpan perbualan penuh (meta + mesej) ke IndexedDB.
   Mesej termasuk imej base64 disimpan tanpa had kuota localStorage. */
async function persistConversation() {
  if (!state.currentId) return;
  const conv = state.conversations.find(c => c.id === state.currentId);
  if (!conv) return;
  conv.updatedAt = Date.now();
  if (state.user) {
    await persistConversationCloud(conv, state.messages);
    return;
  }
  await dbPut('conversations', {
    id: conv.id,
    title: conv.title,
    updatedAt: conv.updatedAt,
    messages: state.messages.map(m => ({ role: m.role, content: m.content }))
  });
}

async function loadAllConversations() {
  if (state.user) {
    await loadAllConversationsCloud();
    return;
  }
  const all = await dbGetAll('conversations');
  state.conversations = all
    .map(c => ({ id: c.id, title: c.title, updatedAt: c.updatedAt || 0 }))
    .sort((a, b) => b.updatedAt - a.updatedAt);
  renderSidebar();
}

function createLocalConversation(title) {
  const id = crypto.randomUUID ? crypto.randomUUID() : ('c' + Date.now() + Math.random().toString(36).slice(2));
  const conv = { id, title: title || 'Perbualan Baharu', updatedAt: Date.now() };
  state.conversations.unshift(conv);
  return conv;
}



/* ============================================================
   RENDER MESSAGES
============================================================ */
function messageHTML(msg, idx) {
  if (msg.role === 'user') {
    const images = (msg.content && Array.isArray(msg.content))
      ? msg.content.filter(p => p.type === 'image_url')
      : [];
    const text = (msg.content && Array.isArray(msg.content))
      ? msg.content.filter(p => p.type === 'text').map(p => p.text).join('\n')
      : (typeof msg.content === 'string' ? msg.content : '');

    const imgs = images.map(im => {
      const src = im.image_url && im.image_url.url ? im.image_url.url : '';
      return `<img src="${src}" class="rounded-lg max-h-64 border border-white/10" alt="imej" />`;
    }).join('');

    return `
      <div class="fade-in flex justify-end px-2 py-1" data-idx="${idx}">
        <div class="max-w-[85%] md:max-w-[75%]">
          ${imgs ? `<div class="mb-1.5 flex justify-end gap-2 flex-wrap">${imgs}</div>` : ''}
          ${text ? `<div class="bg-bubbleUser rounded-2xl rounded-br-md px-4 py-2.5 text-sm whitespace-pre-wrap">${escapeHtml(text)}</div>` : ''}
        </div>
      </div>`;
  }

  // assistant
  const text = typeof msg.content === 'string' ? msg.content : '';
  return `
    <div class="fade-in flex px-2 py-1" data-idx="${idx}">
      <div class="w-7 h-7 rounded-full bg-brand-600 flex items-center justify-center shrink-0 mr-3 mt-0.5 text-xs font-bold">AI</div>
      <div class="max-w-[85%] md:max-w-[75%] prose-custom text-sm">
        <div class="msg-content">${renderMarkdown(text)}</div>
        <div class="msg-actions flex items-center gap-1 mt-1.5 text-xs text-gray-400 opacity-0 hover:opacity-100 transition">
          <button class="copy-btn p-1.5 rounded hover:bg-white/10" title="Salin"><i class="fa-regular fa-copy"></i></button>
          <button class="regen-btn p-1.5 rounded hover:bg-white/10" title="Jana semula"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>
    </div>`;
}

function renderMessages() {
  if (!state.messages.length) {
    messagesEl.innerHTML = emptyStateHTML();
    return;
  }
  messagesEl.innerHTML = state.messages.map((m, i) => messageHTML(m, i)).join('');
  enhanceCodeBlocks();
  bindMessageActions();
  scrollToBottom(true);
}

function emptyStateHTML() {
  return `
    <div class="h-full flex flex-col items-center justify-center px-6 text-center">
      <div class="w-14 h-14 rounded-full bg-brand-600 flex items-center justify-center text-2xl mb-4">
        <i class="fa-solid fa-robot"></i>
      </div>
      <h2 class="text-2xl font-semibold mb-2">Apa yang boleh saya bantu hari ini?</h2>
      <p class="text-gray-400 mb-8 max-w-md text-sm">Tanya apa sahaja, hantar imej untuk dianalisis, atau minta saya menulis kod.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-lg">
        ${suggestionChip('Jelaskan konsep pembelajaran mesin dengan ringkas', 'fa-brain')}
        ${suggestionChip('Tulis fungsi Python untuk menyusun senarai', 'fa-code')}
        ${suggestionChip('Huraikan cara membuat resume yang menarik', 'fa-file-lines')}
        ${suggestionChip('Terangkan teori relativiti secara mudah', 'fa-lightbulb')}
      </div>
    </div>`;
}

function suggestionChip(text, icon) {
  return `
    <button class="suggestion-btn text-left border border-white/15 rounded-xl px-4 py-3 text-sm hover:bg-white/5 transition flex items-start gap-2.5">
      <i class="fa-solid ${icon} text-brand-400 mt-0.5"></i>
      <span>${escapeHtml(text)}</span>
    </button>`;
}

function enhanceCodeBlocks() {
  document.querySelectorAll('.msg-content pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;
    const lang = (code.className.match(/language-([\w-]+)/) || [])[1] || '';
    if (lang) hljs.highlightElement(code);

    const header = document.createElement('div');
    header.className = 'code-header';

async function loadConversation(id) {
  try {
    let title = 'Perbualan';
    let messages = [];
    if (state.user) {
      const meta = state.conversations.find(x => x.id === id);
      if (!meta) throw new Error('not found');
      title = meta.title || 'Perbualan';
      messages = await fetchMessagesCloud(id);
    } else {
      const conv = await dbGet('conversations', id);
      if (!conv) throw new Error('not found');
      title = conv.title || 'Perbualan';
      messages = conv.messages || [];
    }
    state.currentId = id;
    state.messages = messages.map(m => ({ role: m.role, content: m.content }));
    state.attachedImages = [];
    clearImagePreviews();
    convTitleEl.textContent = title;
    renderMessages();
    renderSidebar();
    toggleSidebar(false);
  } catch (e) {
    showToast('Gagal memuat perbualan');
  }
}

async function renameConversation(id) {
  const c = state.conversations.find(x => x.id === id);
  const name = prompt('Namakan semula perbualan:', c ? c.title : '');
  if (!name || !name.trim()) return;

  if (state.user) {
    await supabase.from('conversations').update({ title: name.trim() }).eq('id', id);
  } else {
    const conv = await dbGet('conversations', id);
    if (conv) {
      conv.title = name.trim();
      await dbPut('conversations', conv);
    }
  }
  const meta = state.conversations.find(x => x.id === id);
  if (meta) meta.title = name.trim();
  if (id === state.currentId) convTitleEl.textContent = name.trim();
  renderSidebar();
}

async function deleteConversation(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!confirm(`Padam perbualan "${c ? c.title : ''}"?`)) return;
  if (state.user) {
    await supabase.from('conversations').delete().eq('id', id);
  } else {
    await dbDelete('conversations', id);
  }
  state.conversations = state.conversations.filter(x => x.id !== id);
  if (id === state.currentId) {
    state.currentId = null;
    state.messages = [];
    convTitleEl.textContent = 'Perbualan Baharu';
    renderMessages();
  }
  renderSidebar();
}

function ensureConversation() {
  if (state.currentId) return Promise.resolve(state.currentId);
  const conv = createLocalConversation('Perbualan Baharu');
  state.currentId = conv.id;
  renderSidebar();
  if (state.user) return persistConversationCloud(conv, []).then(() => conv.id);
  return Promise.resolve(conv.id);
}



/* ============================================================
   CHAT LOGIC
============================================================ */
async function sendMessage() {
  const text = inputEl.value.trim();
  if ((!text && !state.attachedImages.length) || state.streaming) return;

  // Bina content user
  let userContent = text;
  if (state.attachedImages.length) {
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    state.attachedImages.forEach(img => {
      parts.push({ type: 'image_url', image_url: { url: img.dataUrl } });
    });
    userContent = parts;
  }

  // Pastikan perbualan wujud (buat baru jika perlu)
  await ensureConversation();

  // Tambah mesej user ke UI + state
  state.messages.push({ role: 'user', content: userContent });
  renderMessages();

  // Kosongkan input & imej
  inputEl.value = '';
  autoResize();
  state.attachedImages = [];
  clearImagePreviews();
  updateSendBtn();

  // Auto-title: gunakan 40 aksara pertama mesej pertama
  autoTitle(text);

  // Simpan segera ke IndexedDB (sebelum respons AI)
  await persistConversation();
  refreshSidebar();

  await runAssistant();
}

function autoTitle(text) {
  const c = state.conversations.find(x => x.id === state.currentId);
  if (c && c.title === 'Perbualan Baharu' && text) {
    c.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
    convTitleEl.textContent = c.title;
  }
}

async function runAssistant() {
  state.streaming = true;
  updateSendBtn();

  // Tambah placeholder assistant
  const placeholderIdx = state.messages.length;
  state.messages.push({ role: 'assistant', content: '' });
  renderMessages();

  // Tandakan elemen content aktif
  const assistantEl = messagesEl.querySelector(`[data-idx="${placeholderIdx}"] .msg-content`);
  let full = '';

  // Hantar SEMUA mesej kecuali placeholder (yang terakhir)
  const apiMessages = state.messages
    .slice(0, -1)
    .map(m => ({ role: m.role, content: m.content }));

  // V2: Prepend system prompt persona sebagai mesej pertama.
  //     (Custom prompt hanya disertakan jika ada teks)
  const sysMsg = buildSystemMessage();
  if (sysMsg) apiMessages.unshift({ role: 'system', content: sysMsg });

  state.controller = new AbortController();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: apiMessages,
        stream: true,
        model: state.model || undefined
      }),
      signal: state.controller.signal
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Ralat pelayan');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let payload;
        try { payload = JSON.parse(part.slice(6)); }
        catch { continue; }

        if (payload.error) {
          throw new Error(payload.error);
        }
        if (payload.delta) {
          full += payload.delta;
          scheduleStreamRender(assistantEl, () => full);
        }
        if (payload.done) {
          full = payload.full || full;
        }
      }
    }

    state.messages[placeholderIdx].content = full;
    renderMessages();

    if (!full) {
      state.messages[placeholderIdx].content = '(Tiada respons diterima)';
      renderMessages();
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      state.messages[placeholderIdx].content = full || '(Dijana sebahagian — dihentikan)';
    } else {
      state.messages[placeholderIdx].content = `⚠️ Ralat: ${err.message}`;
    }
    renderMessages();
  } finally {
    state.streaming = false;
    state.controller = null;
    updateSendBtn();
    // Simpan mesej akhir (termasuk respons AI) ke IndexedDB
    await persistConversation();
    refreshSidebar();
  }
}

function regenerate(i) {
  if (state.streaming) return;
  // Cari mesej user terakhir SEBELUM assistant index i
  let userIdx = i - 1;
  while (userIdx >= 0 && state.messages[userIdx].role !== 'user') userIdx--;
  if (userIdx < 0) return;

  // Buang semua mesej dari assistant index i ke hujung
  state.messages = state.messages.slice(0, userIdx + 1);
  renderMessages();
  runAssistant();
}

function stopStreaming() {
  if (state.controller) {
    state.controller.abort();
  }
}

function updateSendBtn() {
  const hasText = inputEl.value.trim().length > 0 || state.attachedImages.length > 0;
  if (state.streaming) {
    sendBtn.disabled = false;
    sendIcon.className = 'fa-solid fa-stop';
    sendBtn.onclick = stopStreaming;
  } else {
    sendBtn.disabled = !hasText;
    sendIcon.className = 'fa-solid fa-arrow-up';
    sendBtn.onclick = sendMessage;
  }
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 20 * 1024 * 1024) {
      reject(new Error('Imej terlalu besar (had 20MB)'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addImageFile(file) {
  try {
    const dataUrl = await fileToDataUrl(file);
    state.attachedImages.push({ dataUrl, name: file.name });
    renderImagePreviews();

============================================================ */
function exportMarkdown() {
  if (!state.messages.length) { showToast('Tiada mesej untuk dieksport'); return; }
  const lines = [];
  state.messages.forEach(m => {
    if (m.role === 'user') {
      const text = typeof m.content === 'string' ? m.content
        : (Array.isArray(m.content) ? m.content.filter(p => p.type === 'text').map(p => p.text).join(' ') : '');
      if (text) lines.push(`**Anda:** ${text}`);
    } else {
      const text = typeof m.content === 'string' ? m.content : '';
      if (text) lines.push(`**AI:**\n\n${text}`);
    }
  });
  const md = lines.join('\n\n---\n\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(convTitleEl.textContent || 'perbualan').replace(/[\\/:*?"<>|]/g, '_')}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

/* Bina system prompt berdasarkan persona terpilih.
   - Bukan custom: guna prompt persona.
   - Custom: prompt() untuk minta prompt tersuai; null jika dibatalkan.
   Return null bermaksud tiada system message perlu dihantar. */
function buildSystemMessage() {
  const p = personas.find(x => x.id === state.persona);
  if (!p) return null;

  if (p.id !== 'custom') {
    return p.prompt || null;
  }

  const custom = prompt(
    'Masukkan system prompt tersuai untuk sesi ini:',
    localStorage.getItem('v2_custom_prompt') || ''
  );
  if (custom === null) return null;          // batal -> pelayan guna prompt lalai
  const trimmed = custom.trim();
  if (!trimmed) return null;
  localStorage.setItem('v2_custom_prompt', trimmed);
  return trimmed;
}


/* ============================================================
   V2 — VOICE-TO-TEXT (webkitSpeechRecognition)
============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Pilih bahasa yang disokong pelayar (utamakan ms-MY, fallback en-US/en-GB)
function detectSupportedLangs() {
  if (!SR) return [];
  const candidates = ['ms-MY', 'ms', 'en-US', 'en-GB'];
  const avail = [];
  try {
    for (const c of candidates) {
      const r = new SR();
      r.lang = c;
      avail.push(c);
    }
  } catch (e) { /* abaikan */ }
  // Jika pelayar tidak menyokong bahasa khusus, guna lalai pelayar
  return avail.length === candidates.length ? candidates : [];
}

let SUPPORTED_LANGS = [];
let recognition = null;

function toggleListening() {
  if (!SR) {
    showToast('Voice input tidak disokong pelayar ini (guna Chrome/Edge)');
    return;
  }
  if (state.listening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  try {
    recognition = new SR();
  } catch (e) {
    showToast('Tidak dapat memulakan pengenalan suara');
    return;
  }

  if (!SUPPORTED_LANGS.length) SUPPORTED_LANGS = detectSupportedLangs();
  recognition.lang = SUPPORTED_LANGS[0] || 'ms-MY';
  recognition.continuous = false;    // berhenti selepas satu frasa
  recognition.interimResults = true; // papar teks sementara
  recognition.maxAlternatives = 1;

  const before = inputEl.value;
  let base = before ? before.replace(/\s+$/, '') + ' ' : '';

  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) base += t + ' ';
      else interim += t;
    }
    inputEl.value = (base + interim).replace(/\s+/g, ' ').trim();
    autoResize();
    updateSendBtn();
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showToast('Akses mikrofon dinafikan. Benarkan akses dalam pelayar.');
    } else if (e.error !== 'aborted') {
      showToast('Ralat suara: ' + e.error);
    }
  };

  recognition.onend = () => {
    stopListening();
  };

  state.listening = true;
  micBtn.classList.add('listening');
  micBtn.title = 'Berhenti mendengar';
  recognition.start();
}

function stopListening() {
  if (!state.listening) return;
  state.listening = false;
  micBtn.classList.remove('listening');
  micBtn.title = 'Cakap untuk taip (suara)';
  try { recognition && recognition.stop(); } catch (e) { /* abaikan */ }
}

micBtn.addEventListener('click', toggleListening);

============================================================ */
const installBtn = $('installBtn');
const iosInstallTip = $('iosInstallTip');
let deferredPrompt = null;

// Kesan iOS Safari (tidak sokong beforeinstallprompt)
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone === true;

if (isIOS && !isStandalone) {
  iosInstallTip.classList.remove('hidden');
} else if (!isStandalone) {
  // Tunjukkan butang install hanya selepas event beforeinstallprompt tersedia
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.remove('hidden');
    installBtn.classList.add('flex');
  });
}

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice;
  if (choice.outcome === 'accepted') {
    showToast('Aplikasi sedang dipasang…');
  }
  deferredPrompt = null;
  installBtn.classList.add('hidden');
  installBtn.classList.remove('flex');
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installBtn.classList.add('hidden');
  installBtn.classList.remove('flex');
  showToast('Aplikasi berjaya dipasang!');
});

// Daftar Service Worker (di root)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}


/* ============================================================
   V3 — SUPAABASE: GOOGLE AUTH & CLOUD SYNC
============================================================ */
let supabase = null;          // klien Supabase (dimula selepas /api/config)
let supabaseEnabled = false;  // true jika SUPABASE_URL/ANON_KEY disediakan
let realtimeChannel = null;

/* Panggil initSupabase() daripada loadConfig() apabila config siap. */
function initSupabase() {
  if (!config || !config.supabase || !config.supabase.enabled) return;
  supabaseEnabled = true;
  supabase = window.supabase.createClient(
    config.supabase.url,
    config.supabase.anon_key
  );

  // Pulih sesi tersedia (refresh token disimpan secara automatik oleh SDK)
  supabase.auth.getSession().then(({ data }) => {
    if (data && data.session) {
      setUser(data.session.user, data.session);
    }
    renderAuthUI();
  });

  // Pantau perubahan status auth (log masuk / log keluar / token refresh)
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      setUser(session.user, session);
    } else if (event === 'SIGNED_OUT') {
      setUser(null, null);
    }
    renderAuthUI();
  });
}

function renderAuthUI() {
  const loggedIn = !!state.user;
  const guestEl = $('authGuest');
  const userEl = $('authUser');
  const syncBadge = $('syncBadge');
  if (!guestEl || !userEl) return;

  if (loggedIn) {
    guestEl.classList.add('hidden');
    userEl.classList.remove('hidden');
    syncBadge.classList.remove('hidden');
    syncBadge.classList.add('flex');

    const name = state.user.user_metadata?.full_name
      || state.user.user_metadata?.name
      || (state.user.email ? state.user.email.split('@')[0] : 'Pengguna');
    $('userName').textContent = name;
    $('userEmail').textContent = state.user.email || '';

    const avatarUrl = state.user.user_metadata?.avatar_url
      || state.user.user_metadata?.picture;
    const avatar = $('userAvatar');
    if (avatarUrl) {
      avatar.innerHTML = `<img src="${escapeHtml(avatarUrl)}" class="w-full h-full object-cover" alt="avatar" referrerpolicy="no-referrer" />`;
    } else {
      avatar.innerHTML = `<span>${escapeHtml((name[0] || 'U').toUpperCase())}</span>`;
    }
  } else {
    guestEl.classList.remove('hidden');
    userEl.classList.add('hidden');
    syncBadge.classList.add('hidden');
    syncBadge.classList.remove('flex');
  }
}

/* Tetapkan pengguna aktif; muat semula sejarah dari sumber yang betul. */
async function setUser(user, session) {
  state.user = user || null;
  state.currentId = null;
  state.messages = [];
  state.attachedImages = [];
  clearImagePreviews();
  convTitleEl.textContent = 'Perbualan Baharu';
  renderMessages();

  unsubscribeRealtime();
  if (state.user) {
    subscribeRealtime();
  }
  await loadAllConversations();
}

async function googleSignIn() {
  if (!supabaseEnabled) {
    showToast('Supabase belum dikonfigurasikan pada pelayan (.env)');
    return;
  }
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/' },
  });
  if (error) showToast('Log masuk gagal: ' + error.message);
}

async function signOut() {
  if (!supabase) return;
  await supabase.auth.signOut();
  showToast('Telah log keluar');
}

function subscribeRealtime() {
  if (!supabase || realtimeChannel) return;
  // Channel tunggal; penapis RLS memastikan hanya data sendiri diterima.
  realtimeChannel = supabase
    .channel('conversations-realtime')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'conversations' },
      () => { refreshSidebar(); }
    )
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'messages' },
      () => { refreshSidebar(); }
    )
    .subscribe();
}

function unsubscribeRealtime() {
  if (realtimeChannel) {
    supabase.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
}

/* Muat semula senarai perbualan dari Supabase. */
async function loadAllConversationsCloud() {
  if (!supabase) return;
  const { data, error } = await supabase
    .from('conversations')
    .select('id,title,updated_at')
    .order('updated_at', { ascending: false });
  if (error) {
    showToast('Gagal muat sejarah awan: ' + error.message);
    return;
  }
  state.conversations = (data || []).map(c => ({
    id: c.id,
    title: c.title,
    updatedAt: c.updated_at || 0,
  }));
  renderSidebar();
}

/* Simpan meta perbualan + mesejnya ke Supabase (upsert). */
async function persistConversationCloud(conv, messages) {
  if (!supabase) return;
  const convErr = await supabase
    .from('conversations')
    .upsert({
      id: conv.id,
      title: conv.title,
      updated_at: conv.updatedAt || Date.now(),
    });
  if (convErr.error) {
    showToast('Gagal simpan perbualan ke awan: ' + convErr.error.message);
    return;
  }
  if (messages.length) {
    const rows = messages.map((m, i) => ({
      conversation_id: conv.id,
      idx: i,
      role: m.role,
      content: m.content,
    }));
    const msgErr = await supabase.from('messages').upsert(rows, { onConflict: 'conversation_id,idx' });
    if (msgErr.error) {
      showToast('Gagal simpan mesej ke awan: ' + msgErr.error.message);
    }
  }
}

/* Muat mesej bagi satu perbualan dari Supabase. */
async function fetchMessagesCloud(conversationId) {
  const { data, error } = await supabase
    .from('messages')
    .select('role,content')
    .eq('conversation_id', conversationId)
    .order('idx', { ascending: true });
  if (error) {
    showToast('Gagal muat mesej awan: ' + error.message);
    return [];
  }
  return (data || []).map(m => ({ role: m.role, content: m.content }));
}

/* Event listeners auth */
$('googleSignInBtn').addEventListener('click', googleSignIn);
$('signOutBtn').addEventListener('click', signOut);
</script>
